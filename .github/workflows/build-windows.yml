name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download FFmpeg for Windows
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force -Path vendor/ffmpeg/win32 | Out-Null
          Copy-Item ffmpeg-tmp/*/bin/ffmpeg.exe vendor/ffmpeg/win32/
          Copy-Item ffmpeg-tmp/*/LICENSE.txt vendor/ffmpeg/win32/

      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cutroom ${{ steps.ver.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/Cutroom-Setup-*.exe
          body: |
            ## Download
            Click **Cutroom-Setup-${{ steps.ver.outputs.version }}.exe** below, then run it.

            Windows SmartScreen may say "Windows protected your PC" because the app isn't code-signed. Click **More info → Run anyway**.

            See the README for features and instructions.
